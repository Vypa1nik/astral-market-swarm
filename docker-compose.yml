version: '3.8'

services:
  astral-market-swarm:
    build: .
    container_name: astral-market-swarm
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Trading configuration
      SYMBOL: ${SYMBOL:-BTC/USDT}
      INTERVAL: ${INTERVAL:-5m}
      DEMO_CASH: ${DEMO_CASH:-5000}
      DISPLAY_CURRENCY: ${DISPLAY_CURRENCY:-USDT}
      
      # Strategy parameters
      LOOKBACK: ${LOOKBACK:-250}
      POLL_SECONDS: ${POLL_SECONDS:-300}
      
      # Storage
      STATE_DB: /app/state/orders.sqlite3
      
      # API endpoint
      BINANCE_PUBLIC_BASE_URL: ${BINANCE_PUBLIC_BASE_URL:-https://api.binance.com/api/v3}
      
    volumes:
      # Persist order state across container restarts
      - ./state:/app/state
      
      # Persist research reports
      - ./reports:/app/reports
      
      # Persist logs
      - ./logs:/app/logs
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
